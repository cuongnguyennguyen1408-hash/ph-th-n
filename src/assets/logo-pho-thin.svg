<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Arc for Top Text: "The Original Vietnamese Cuisine" -->
    <path id="top-arc-inner" d="M 50,250 A 200,200 0 0,1 450,250" fill="none" />

    <!-- Arc for Bottom Text: "1 Hang Tre Street - Ha Noi" -->
    <path id="bottom-arc-inner" d="M 65,250 A 185,185 0 0,0 435,250" fill="none" />

    <!-- Gentle arc for PHỞ THÌN -->
    <path id="pho-thin-arc-inner" d="M 45,305 Q 250,265 455,305" fill="none" />

    <!-- Gentle arc for BỜ HỒ -->
    <path id="bo-ho-arc-inner" d="M 130,375 Q 250,345 370,375" fill="none" />
  </defs>

  <!-- Background circular disc with clean ivory white fill -->
  <circle cx="250" cy="250" r="245" fill="#FFFFFF" />

  <!-- TOP ARCUATE TEXT: The Original Vietnamese Cuisine -->
  <text fill="#111827" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="28" font-style="italic" font-weight="700" letter-spacing="1">
    <textPath href="#top-arc-inner" startOffset="50%" text-anchor="middle">
      The Original Vietnamese Cuisine
    </textPath>
  </text>

  <!-- TURTLE TOWER (THÁP RÙA) IN GREEN (#0E7A3E) -->
  <g fill="#0E7A3E">
    <!-- Top finial spire -->
    <path d="M 248,110 L 252,110 L 251,104 L 249,104 Z" />
    <circle cx="250" cy="103" r="2.5" />

    <!-- Top Roof - tiered eaves with pagoda curvature -->
    <path d="M 239,122 C 243,120 247,117 250,111 C 253,117 257,120 261,122 C 255,123 245,123 239,122 Z" />
    <rect x="241" y="122" width="18" height="2" />

    <!-- Top Tier Pavilion -->
    <rect x="242" y="124" width="16" height="13" rx="1" />
    <!-- Top Tier central arched opening -->
    <path d="M 247,137 L 247,130 Q 250,127 253,130 L 253,137 Z" fill="#FFFFFF" />

    <!-- Middle Roof -->
    <path d="M 230,140 C 236,138 243,137 250,137 C 257,137 264,138 270,140 C 263,142 237,142 230,140 Z" />
    <rect x="232" y="140" width="36" height="2.5" />

    <!-- Middle Tier Pavilion -->
    <rect x="233" y="142" width="34" height="17" />
    <!-- Middle Tier 3 Arches -->
    <path d="M 236,159 L 236,150 Q 239,147 242,150 L 242,159 Z" fill="#FFFFFF" />
    <path d="M 247,159 L 247,149 Q 250,145 253,149 L 253,159 Z" fill="#FFFFFF" />
    <path d="M 258,159 L 258,150 Q 261,147 264,150 L 264,159 Z" fill="#FFFFFF" />

    <!-- Lower Roof / Eaves Cornice -->
    <path d="M 221,162 C 230,160 240,159 250,159 C 260,159 270,160 279,162 C 270,164 230,164 221,162 Z" />
    <rect x="223" y="162" width="54" height="3" />

    <!-- Bottom Tier Body -->
    <rect x="225" y="165" width="50" height="20" />
    <!-- Bottom Tier 3 Main Portals -->
    <path d="M 230,185 L 230,173 Q 234,169 238,173 L 238,185 Z" fill="#FFFFFF" />
    <path d="M 246,185 L 246,171 Q 250,167 254,171 L 254,185 Z" fill="#FFFFFF" />
    <path d="M 262,185 L 262,173 Q 266,169 270,173 L 270,185 Z" fill="#FFFFFF" />

    <!-- Base Plinth -->
    <rect x="220" y="185" width="60" height="4" />
  </g>

  <!-- "since" (left of tower) -->
  <text x="210" y="176" text-anchor="end" fill="#111827" font-family="'Playfair Display', Georgia, serif" font-size="22" font-style="italic" font-weight="600">
    since
  </text>

  <!-- "1955" (right of tower) -->
  <text x="290" y="176" text-anchor="start" fill="#111827" font-family="'Playfair Display', Georgia, serif" font-size="23" font-weight="700">
    1955
  </text>

  <!-- CENTER LOGO TEXT: PHỞ THÌN (Deep Burgundy Red #8C1D24) -->
  <text fill="#8C1D24" font-family="'Playfair Display', 'Cinzel', 'Be Vietnam Pro', Georgia, serif" font-size="64" font-weight="900" letter-spacing="3">
    <textPath href="#pho-thin-arc-inner" startOffset="50%" text-anchor="middle">
      PHỞ THÌN
    </textPath>
  </text>

  <!-- SUBTITLE LOGO TEXT: BỜ HỒ (Deep Burgundy Red #8C1D24) -->
  <text fill="#8C1D24" font-family="'Playfair Display', 'Cinzel', 'Be Vietnam Pro', Georgia, serif" font-size="44" font-weight="900" letter-spacing="3">
    <textPath href="#bo-ho-arc-inner" startOffset="50%" text-anchor="middle">
      BỜ HỒ
    </textPath>
  </text>

  <!-- BOTTOM ARCUATE TEXT: 1 Hang Tre Street - Ha Noi -->
  <text fill="#111827" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="24" font-style="italic" font-weight="700" letter-spacing="1">
    <textPath href="#bottom-arc-inner" startOffset="50%" text-anchor="middle">
      1 Hang Tre Street - Ha Noi
    </textPath>
  </text>
</svg>
